<script>
/* Full-screen viewer: click a photo; arrows or the side buttons move between photos; Esc, x or a click outside closes. */
(function () {
  var shots = [].slice.call(document.querySelectorAll(".shot"));
  var v = document.querySelector(".viewer"), img = v.querySelector("img"), cap = v.querySelector("figcaption");
  var i = 0, last = null, x0 = null;
  function show(n) {
    i = (n + shots.length) % shots.length;
    var s = shots[i], b = s.querySelector("button");
    img.src = b.getAttribute("data-full");
    img.alt = s.querySelector("img").alt;
    cap.innerHTML = s.querySelector("figcaption").innerHTML + '<span class="count">' + (i + 1) + " / " + shots.length + "</span>";
    var nxt = shots[(i + 1) % shots.length].querySelector("button");   /* warm up the next photo */
    new Image().src = nxt.getAttribute("data-full");
  }
  function open(n) { last = document.activeElement; show(n); v.classList.add("open"); document.documentElement.classList.add("viewer-on"); v.querySelector(".close").focus(); }
  function close() { v.classList.remove("open"); document.documentElement.classList.remove("viewer-on"); if (last) last.focus(); }
  shots.forEach(function (s, n) { s.querySelector("button").addEventListener("click", function () { open(n); }); });
  v.querySelector(".close").addEventListener("click", close);
  v.querySelector(".prev").addEventListener("click", function (e) { e.stopPropagation(); show(i - 1); });
  v.querySelector(".next").addEventListener("click", function (e) { e.stopPropagation(); show(i + 1); });
  v.addEventListener("click", function (e) { if (e.target === v || e.target.tagName === "FIGURE") close(); });
  document.addEventListener("keydown", function (e) {
    if (!v.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") show(i + 1);
    else if (e.key === "ArrowLeft") show(i - 1);
  });
  /* swipe on phones */
  v.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  v.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
  });
})();
</script>
